[package]
name = "lockout-ai"
description = "lockout: lockout/tagout for AI output. Blocks or flags worker health and incident data in LLM response streams."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "lockout"
path = "src/main.rs"

[dependencies]
lockout-ai-core.workspace = true
regex.workspace = true
serde.workspace = true
toml.workspace = true
clap = { version = "4", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["rt", "macros", "io-std", "io-util", "fs", "sync", "time"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls-native-roots", "http2"] }

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
wiremock = "0.6"
